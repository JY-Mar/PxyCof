name: Generate Clash/Loon Resources

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force Update"
        required: false
        default: false
        type: boolean

  # main分支提交触发
  push:
    branches:
      - main
    paths:
      - "Clash/**/*.yaml"
      - "Loon/**/*.lcf"

# 设置权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  generate-resources:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🗃️ Create output directory and copy something
        run: |
          mkdir -p docs
          mkdir -p docs/Clash
          mkdir -p docs/Loon
          cp -r Clash/Config/* docs/Clash
          cp -r Loon/Config/* docs/Loon

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: 👉 Repository Dispatch "JY-Mar/PxyGen"
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.CLASH_GITHUB_TOKEN }}
          repository: JY-Mar/PxyGen
          event-type: Triggered From JY-Mar/PxyCof
          # 可选：你还可以传递一些数据过去
          # client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: generate-resources

    steps:
      - name: ⬆️ Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
